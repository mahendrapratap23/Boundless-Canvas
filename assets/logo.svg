<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <!-- Square canvas frame with open right portal -->
  <path d="M102 38 H38 V122 H102 V88" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="miter"/>
  <path d="M102 38 V48" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>

  <!-- Infinity loop breaking through the canvas boundary -->
  <!-- Left loop inside canvas, right loop outside canvas -->
  <path d="M 72 68 
           C 62 55, 46 55, 46 68 
           C 46 81, 62 81, 72 68 
           C 82 55, 98 55, 98 68 
           C 98 81, 82 81, 72 68 Z" 
        stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
